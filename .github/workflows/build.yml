name: build-packages

on:
  workflow_dispatch:
    inputs:
      base_asset:
        description: "Windows 包复用的上一版 SFX 地址（留空用 v1.0.0 那版做引擎底座）"
        required: false
  push:
    tags: ["v*"]

jobs:
  linux-portable:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev libgmp-dev libpcap-dev libbz2-dev p7zip-full perl

      - name: 缓存 john-jumbo
        uses: actions/cache@v4
        with:
          path: ~/john-src
          key: john-37bebbe4b6442c8dd3888e5848ef062c0783e9f3

      - name: 编译 john-jumbo
        run: |
          set -e
          if [ ! -x ~/john-src/run/john ]; then
            rm -rf ~/john-src
            git clone --filter=blob:none https://github.com/openwall/john ~/john-src
            cd ~/john-src
            git checkout 37bebbe4b6442c8dd3888e5848ef062c0783e9f3
            cd src
            ./configure
            make -sj"$(nproc)"
          fi
          ~/john-src/run/john --list=build-info | head -3

      - name: 下载并组装引擎
        run: |
          set -eux
          mkdir -p engines/john engines/hashcat/modules engines/bin engines/vendor
          cp -a ~/john-src/run engines/john/run

          curl -fsSL -o /tmp/hc.7z https://github.com/hashcat/hashcat/releases/download/v6.2.6/hashcat-6.2.6.7z
          7z x -y -o/tmp/hc /tmp/hc.7z > /dev/null
          HC=/tmp/hc/hashcat-6.2.6
          install -m 0755 "$HC/hashcat.bin" engines/hashcat/hashcat.bin
          install -m 0644 "$HC/hashcat.hcstat2" engines/hashcat/hashcat.hcstat2
          cp -a "$HC/OpenCL" engines/hashcat/OpenCL
          for m in 00000 11600 12500 13000 13600 17200 17210 17220 17225 17230 23700 23800; do
            install -m 0644 "$HC/modules/module_$m.so" "engines/hashcat/modules/module_$m.so"
          done

          curl -fsSL -o /tmp/7z.tar.xz https://www.7-zip.org/a/7z2301-linux-x64.tar.xz
          tar -xJf /tmp/7z.tar.xz -C /tmp
          install -m 0755 /tmp/7zz engines/bin/7zz

          curl -fsSL -o /tmp/rar.tar.gz https://www.rarlab.com/rar/rarlinux-x64-624.tar.gz
          tar -xzf /tmp/rar.tar.gz -C /tmp
          install -m 0755 /tmp/rar/unrar engines/bin/unrar

          curl -fsSL -o /tmp/lzma.deb http://deb.debian.org/debian/pool/main/libc/libcompress-raw-lzma-perl/libcompress-raw-lzma-perl_2.204-1_amd64.deb
          dpkg-deb -x /tmp/lzma.deb engines/vendor/perl5

      - name: 单元测试
        run: |
          python3 -m py_compile crumbs_cracker.py
          python3 tests/test_keyspace.py
          python3 tests/test_gpu_hashcat.py

      - name: 打包
        env:
          HC_SRC: ${{ github.workspace }}/engines/hashcat
          SEVENZ_SRC: ${{ github.workspace }}/engines/bin/7zz
          UNRAR_SRC: ${{ github.workspace }}/engines/bin/unrar
          SAMPLES_DIR: /nonexistent
        run: bash scripts/build-portable.sh dist

      - name: 校验产物
        run: |
          set -e
          cd dist
          ls -l
          7z t *.7z | tail -2
          sha256sum *.7z > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: crumbs-cracker-portable-linux-x64
          path: |
            dist/*.7z
            dist/SHA256SUMS
          if-no-files-found: error

  windows-sfx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 7-Zip
        shell: pwsh
        run: '"C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: 解出上一版引擎
        shell: pwsh
        env:
          BASE_ASSET: ${{ inputs.base_asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = $env:BASE_ASSET
          if ([string]::IsNullOrWhiteSpace($url)) {
            $url = 'https://github.com/crumbs-fish/crumbs-cracker/releases/download/v1.0.0/crumbs-cracker-portable-win64-sfx-20261122.exe'
          }
          Invoke-WebRequest -Uri $url -OutFile base.exe -UseBasicParsing
          7z x -y -obase base.exe | Out-Null
          if (-not (Test-Path 'base/crumbs-cracker-portable-win64')) { throw '解包后找不到 crumbs-cracker-portable-win64' }

      - name: 覆盖驱动、文档与许可证
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'base/crumbs-cracker-portable-win64'
          Copy-Item crumbs_cracker.py "$stage/crumbs_cracker.py" -Force
          Remove-Item "$stage/docs" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item docs "$stage/docs" -Recurse -Force
          Copy-Item LICENSE, THIRD_PARTY_LICENSES.md "$stage/" -Force
          Remove-Item "$stage/licenses" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item licenses "$stage/licenses" -Recurse -Force
          Copy-Item scripts/portable-README-win.md "$stage/README.txt" -Force
          Copy-Item scripts/portable-LICENSES.txt "$stage/LICENSES.txt" -Force

      - name: 打自解压包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item base\pkg.7z -ErrorAction SilentlyContinue
          7z a -t7z -mx=9 -m0=lzma2:d=64m:fb=273 -mmt=2 base\pkg.7z base\crumbs-cracker-portable-win64 | Out-Null
          cmd /c copy /b "vendor\7zCon.sfx"+"base\pkg.7z" "base\crumbs-cracker-portable-win64-sfx.exe" | Out-Null
          7z t base\crumbs-cracker-portable-win64-sfx.exe | Select-Object -Last 3
          Get-FileHash base\crumbs-cracker-portable-win64-sfx.exe -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: crumbs-cracker-portable-win64-sfx
          path: base/crumbs-cracker-portable-win64-sfx.exe
          if-no-files-found: error
