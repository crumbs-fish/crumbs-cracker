name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 语法与帮助
        run: |
          python3 -m py_compile crumbs_cracker.py
          python3 crumbs_cracker.py -h > /dev/null
      - name: 组合数护栏测试
        run: python3 tests/test_keyspace.py
      - name: GPU 选择与回退测试
        run: python3 tests/test_gpu_hashcat.py
